<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>群管助手</title>
<style>
    :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1e222b;
        --line: #2a2f3a;
        --text: #e8ecf3;
        --text-dim: #98a2b3;
        --accent: #6d5efc;
        --accent-soft: #6d5efc22;
        --ok: #3ddc97;
        --warn: #ffb020;
        --danger: #ff5c72;
        --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 20px 24px 80px;
        background: var(--bg); color: var(--text);
        font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    h3 { font-size: 13px; margin: 0 0 8px; color: var(--text-dim); font-weight: 600; }
    .sub { color: var(--text-dim); font-size: 12px; }

    .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
    }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .stat b { display: block; font-size: 17px; font-weight: 600; }
    .stat span { color: var(--text-dim); font-size: 12px; }
    .spacer { flex: 1; }

    button {
        font: inherit; cursor: pointer; color: var(--text);
        background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 9px; padding: 7px 14px; transition: .15s;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { filter: brightness(1.1); }
    button.danger { color: var(--danger); border-color: #ff5c7240; }
    button.danger:hover { background: #ff5c7218; border-color: var(--danger); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    input[type="text"], input[type="number"], textarea, select {
        font: inherit; color: var(--text); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px;
        width: 100%; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 62px; }
    label.field { display: block; margin-bottom: 10px; }
    label.field > span { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }

    /* 开关 */
    .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .switch input { display: none; }
    .switch .track {
        width: 38px; height: 21px; border-radius: 999px; background: #333a48;
        position: relative; transition: .18s; flex: none;
    }
    .switch .track::after {
        content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px;
        border-radius: 50%; background: #fff; transition: .18s;
    }
    .switch input:checked + .track { background: var(--accent); }
    .switch input:checked + .track::after { transform: translateX(17px); }
    .switch span.lb { font-size: 12px; color: var(--text-dim); }

    /* 群配置卡片 */
    .profile { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; background: var(--panel-2); }
    .profile-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .profile-head input.name { max-width: 280px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
        display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
        background: var(--accent-soft); border: 1px solid #6d5efc55; color: #cdc7ff;
        border-radius: 999px; padding: 2px 9px;
    }
    .tag.grey { background: #ffffff0d; border-color: var(--line); color: var(--text-dim); }
    .tag b { font-weight: 500; }
    .tag i { cursor: pointer; font-style: normal; opacity: .7; }
    .tag i:hover { opacity: 1; color: var(--danger); }

    .picker { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--panel); margin-top: 8px; }
    .picker-list { max-height: 190px; overflow: auto; margin-top: 8px; display: grid; gap: 4px; }
    .picker-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 6px; border-radius: 7px; cursor: pointer; }
    .picker-item:hover { background: #ffffff08; }
    .picker-item small { color: var(--text-dim); }

    table.features { width: 100%; border-collapse: collapse; margin-top: 6px; }
    table.features th, table.features td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    table.features th { font-size: 12px; color: var(--text-dim); font-weight: 500; }
    table.features tr.off td { opacity: .55; }
    .feat-name { min-width: 150px; }
    .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-dim); margin-left: 6px; }
    .badge.dev { color: var(--warn); border-color: #ffb02055; }
    .params { background: #00000030; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; margin: 6px 0 14px; }
    .params .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

    /* toast */
    #toast {
        position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-20px);
        background: #22262f; border: 1px solid var(--line); color: var(--text);
        padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none;
        transition: .2s; z-index: 99; box-shadow: 0 10px 30px #0008;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err { border-color: var(--danger); color: #ffd7dd; }
    #toast.ok { border-color: var(--ok); }

    .footer-bar {
        position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 24px;
        background: #0f1115ee; backdrop-filter: blur(8px); border-top: 1px solid var(--line);
        display: flex; align-items: center; gap: 12px;
    }
    .modal-mask {
        position: fixed; inset: 0; background: #000a; display: none;
        align-items: center; justify-content: center; z-index: 100;
    }
    .modal-mask.show { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; max-width: 420px; width: 90%; }
</style>
</head>
<body>
    <div class="row">
        <div>
            <h1>🛡️ 群管助手</h1>
            <div class="sub" id="statusLine">加载中…</div>
        </div>
        <div class="spacer"></div>
        <button id="btnReload">重新加载</button>
        <button class="primary" id="btnSave">保存全部配置</button>
    </div>

    <!-- 状态 -->
    <div class="card" style="margin-top:16px;">
        <h2>运行状态</h2>
        <div class="grid" id="statGrid"></div>
    </div>

    <!-- 全局 -->
    <div class="card">
        <h2>全局设置</h2>
        <div class="row" style="gap:24px;">
            <label class="switch"><input type="checkbox" id="gEnabled" /><span class="track"></span><span class="lb">插件总开关</span></label>
            <label class="switch"><input type="checkbox" id="gDebug" /><span class="track"></span><span class="lb">调试日志</span></label>
            <label class="switch" style="gap:8px;">
                <span class="lb">命令前缀</span>
                <input type="text" id="gPrefix" style="width:70px;" />
            </label>
        </div>
        <div style="margin-top:14px;">
            <h3>Bot 管理员（拥有全部群全部功能的最高权限）</h3>
            <div class="row">
                <input type="text" id="adminInput" placeholder="输入 QQ 号后回车添加" style="max-width:240px;" />
                <button id="btnAddAdmin">添加</button>
            </div>
            <div class="tags" id="adminTags"></div>
        </div>
    </div>

    <!-- 群配置 -->
    <div class="card">
        <h2>
            群配置
            <span class="badge">一条配置可绑定多个群</span>
            <span class="spacer"></span>
            <button id="btnAddProfile">+ 新增群配置</button>
        </h2>
        <div class="sub" style="margin-bottom:12px;">
            同一个群只能出现在一条配置里。功能是否生效 = 「启用」开启 <b>且</b> 使用者命中「群管理可用」或「成员名单」或 Bot 管理员。
        </div>
        <div id="profiles"></div>
    </div>

    <!-- 导入 -->
    <div class="card">
        <h2>导入旧 NoneBot 版配置</h2>
        <div class="sub" style="margin-bottom:10px;">
            填写旧插件 <code>config</code> 目录的绝对路径（含 group_mgmt_config.json）。功能配置相同的群会自动合并成一条配置。
        </div>
        <div class="row">
            <input type="text" id="importDir" placeholder="例如 F:\code\QQ_bot_Plugin\nonebot\config" style="max-width:520px;" />
            <label class="switch"><input type="checkbox" id="importOverwrite" /><span class="track"></span><span class="lb">覆盖已有业务数据</span></label>
            <button id="btnImport">开始导入</button>
        </div>
        <div class="sub" id="importResult" style="margin-top:10px;"></div>
    </div>

    <div class="footer-bar">
        <span class="sub" id="dirtyHint">配置未修改</span>
        <span class="spacer"></span>
        <button class="primary" id="btnSave2">保存全部配置</button>
    </div>

    <div id="toast"></div>
    <div class="modal-mask" id="modalMask">
        <div class="modal">
            <h2 id="modalTitle">确认</h2>
            <div class="sub" id="modalText" style="margin-bottom:16px;"></div>
            <div class="row"><span class="spacer"></span><button id="modalCancel">取消</button><button class="primary" id="modalOk">确定</button></div>
        </div>
    </div>

<script>
(function () {
    'use strict';

    var BASE = location.pathname.replace(/\/(page|files)\/.*$/, '');
    var API = BASE + '/api';

    var state = { meta: null, global: null, profiles: [], groups: [], dirty: false };

    /* ---------------- 工具 ---------------- */

    function $(sel, root) { return (root || document).querySelector(sel); }
    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined && text !== null) n.textContent = text;
        return n;
    }

    function toast(message, kind) {
        var t = $('#toast');
        t.textContent = message;
        t.className = 'show ' + (kind || '');
        clearTimeout(t._timer);
        t._timer = setTimeout(function () { t.className = ''; }, 2600);
    }

    function confirmBox(title, text) {
        return new Promise(function (resolve) {
            $('#modalTitle').textContent = title;
            $('#modalText').textContent = text;
            $('#modalMask').classList.add('show');
            function done(v) {
                $('#modalMask').classList.remove('show');
                $('#modalOk').onclick = null;
                $('#modalCancel').onclick = null;
                resolve(v);
            }
            $('#modalOk').onclick = function () { done(true); };
            $('#modalCancel').onclick = function () { done(false); };
        });
    }

    function markDirty() {
        state.dirty = true;
        $('#dirtyHint').textContent = '有未保存的修改';
        $('#dirtyHint').style.color = 'var(--warn)';
    }

    function clearDirty() {
        state.dirty = false;
        $('#dirtyHint').textContent = '配置未修改';
        $('#dirtyHint').style.color = '';
    }

    function request(path, options) {
        var opt = options || {};
        return fetch(API + path, {
            method: opt.method || 'GET',
            headers: { 'Content-Type': 'application/json' },
            body: opt.body ? JSON.stringify(opt.body) : undefined
        }).then(function (res) {
            return res.json().catch(function () { return { code: -1, message: 'HTTP ' + res.status }; });
        }).then(function (json) {
            if (json && json.code === 0) return json.data;
            throw new Error((json && json.message) || '请求失败');
        });
    }

    /* ---------------- 开关 / 输入绑定 ---------------- */

    function switchBox(checked, label, onChange) {
        var wrap = el('label', 'switch');
        var input = el('input');
        input.type = 'checkbox';
        input.checked = !!checked;
        input.addEventListener('change', function () {
            onChange(input.checked);
            markDirty();
        });
        wrap.appendChild(input);
        wrap.appendChild(el('span', 'track'));
        if (label) wrap.appendChild(el('span', 'lb', label));
        return wrap;
    }

    function textInput(value, placeholder, onChange, width) {
        var input = el('input');
        input.type = 'text';
        input.value = value || '';
        if (placeholder) input.placeholder = placeholder;
        if (width) input.style.maxWidth = width;
        input.addEventListener('input', function () {
            if (onChange) onChange(input.value);
            markDirty();
        });
        return input;
    }

    function numberInput(value, onChange) {
        var input = el('input');
        input.type = 'number';
        input.value = value;
        input.addEventListener('input', function () {
            onChange(Number(input.value));
            markDirty();
        });
        return input;
    }

    /* ---------------- 列表（名单）编辑 ---------------- */

    function listEditor(list, onChange) {
        var wrap = el('div');
        var row = el('div', 'row');
        var input = textInput('', 'QQ 号，回车添加', null, '150px');

        function commit() {
            var v = input.value.trim();
            if (!v) return;
            if (list.indexOf(v) >= 0) { toast('该 QQ 号已在名单中'); return; }
            list.push(v);
            input.value = '';
            onChange();
            markDirty();
            renderTags();
        }

        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); commit(); }
        });

        var btn = el('button', null, '添加');
        btn.addEventListener('click', commit);

        row.appendChild(input);
        row.appendChild(btn);
        wrap.appendChild(row);

        var tags = el('div', 'tags');
        function renderTags() {
            tags.innerHTML = '';
            list.forEach(function (qq, i) {
                var tag = el('span', 'tag');
                tag.appendChild(el('b', null, qq));
                var x = el('i', null, '×');
                x.addEventListener('click', function () {
                    list.splice(i, 1);
                    onChange();
                    markDirty();
                    renderTags();
                });
                tag.appendChild(x);
                tags.appendChild(tag);
            });
        }
        renderTags();
        wrap.appendChild(tags);
        return wrap;
    }

    /* ---------------- 参数渲染 ---------------- */

    function renderParams(feature, settings) {
        var box = el('div', 'params');
        var grid = el('div', 'grid2');
        var meta = null;
        state.meta.features.forEach(function (f) { if (f.key === feature.key) meta = f; });
        var params = meta ? meta.params : [];
        if (!params.length) return null;

        params.forEach(function (p) {
            var field = el('label', 'field');
            field.appendChild(el('span', null, p.label));
            var value = settings.params[p.key];

            if (p.type === 'number') {
                field.appendChild(numberInput(value, function (v) { settings.params[p.key] = v; }));
            } else if (p.type === 'text') {
                field.appendChild(textInput(value, '', function (v) { settings.params[p.key] = v; }));
            } else if (p.type === 'textarea') {
                var ta = el('textarea');
                ta.value = value || '';
                ta.addEventListener('input', function () {
                    settings.params[p.key] = ta.value;
                    markDirty();
                });
                field.appendChild(ta);
            } else if (p.type === 'numberlist') {
                var ta2 = el('textarea');
                ta2.value = (Array.isArray(value) ? value : []).join(', ');
                ta2.rows = 2;
                ta2.addEventListener('input', function () {
                    settings.params[p.key] = ta2.value.split(/[,，\s]+/).filter(Boolean).map(Number);
                    markDirty();
                });
                field.appendChild(ta2);
            } else if (p.type === 'wordlists') {
                var wl = settings.params[p.key] || {};
                (p.subKeys || []).forEach(function (sk) {
                    var sub = el('label', 'field');
                    sub.appendChild(el('span', null, sk.label));
                    var area = el('textarea');
                    var arr = Array.isArray(wl[sk.key]) ? wl[sk.key] : [];
                    area.value = arr.join('\n');
                    area.rows = 4;
                    area.addEventListener('input', function () {
                        wl[sk.key] = area.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
                        settings.params[p.key] = wl;
                        markDirty();
                    });
                    sub.appendChild(area);
                    field.appendChild(sub);
                });
            }

            if (p.hint) field.appendChild(el('span', 'sub', p.hint));
            grid.appendChild(field);
        });

        box.appendChild(grid);
        return box;
    }

    /* ---------------- 群选择器 ---------------- */

    function groupPicker(profile) {
        var wrap = el('div');
        var chosen = el('div', 'tags');
        var panel = el('div', 'picker');
        var search = textInput('', '搜索群号 / 群名，勾选以绑定', null, '320px');
        var list = el('div', 'picker-list');

        function renderChosen() {
            chosen.innerHTML = '';
            if (!profile.group_ids.length) {
                chosen.appendChild(el('span', 'tag grey', '尚未绑定任何群'));
            }
            profile.group_ids.forEach(function (gid, i) {
                var info = state.groups.filter(function (g) { return g.group_id === gid; })[0];
                var tag = el('span', 'tag');
                tag.appendChild(el('b', null, (info ? info.group_name : '未知群') + ' (' + gid + ')'));
                var x = el('i', null, '×');
                x.addEventListener('click', function () {
                    profile.group_ids.splice(i, 1);
                    markDirty();
                    renderChosen();
                    renderList();
                });
                tag.appendChild(x);
                chosen.appendChild(tag);
            });
        }

        function renderList() {
            list.innerHTML = '';
            var kw = search.value.trim().toLowerCase();
            var items = state.groups.filter(function (g) {
                if (!kw) return true;
                return g.group_id.indexOf(kw) >= 0 || (g.group_name || '').toLowerCase().indexOf(kw) >= 0;
            });
            if (!items.length) {
                list.appendChild(el('div', 'sub', '没有匹配的群'));
                return;
            }
            // 归属判断以本地数据为准（服务端快照在编辑期间是旧的）
            var ownerMap = {};
            state.profiles.forEach(function (p) {
                if (p.id === profile.id) return;
                (p.group_ids || []).forEach(function (gid) { ownerMap[gid] = p; });
            });

            items.forEach(function (g) {
                var chosenHere = profile.group_ids.indexOf(g.group_id) >= 0;
                var owner = ownerMap[g.group_id] || null;

                var item = el('label', 'picker-item');
                var cb = el('input');
                cb.type = 'checkbox';
                cb.checked = chosenHere;
                cb.disabled = !!owner;
                cb.addEventListener('change', function () {
                    if (cb.checked) {
                        if (profile.group_ids.indexOf(g.group_id) < 0) profile.group_ids.push(g.group_id);
                    } else {
                        profile.group_ids = profile.group_ids.filter(function (x) { return x !== g.group_id; });
                    }
                    markDirty();
                    renderChosen();
                    renderList();
                });
                item.appendChild(cb);
                item.appendChild(el('span', null, (g.group_name || '未命名群') + ' '));
                item.appendChild(el('small', null, '(' + g.group_id + (g.member_count ? ' · ' + g.member_count + '人' : '') + ')' + (owner ? ' · 已被「' + owner.label + '」绑定' : '')));
                list.appendChild(item);
            });
        }

        search.addEventListener('input', renderList);

        panel.appendChild(el('h3', null, '绑定群（一条配置可绑定多个群）'));
        panel.appendChild(search);
        panel.appendChild(list);

        wrap.appendChild(chosen);
        wrap.appendChild(panel);
        renderChosen();
        renderList();
        return wrap;
    }

    /* ---------------- 渲染 ---------------- */

    function renderGlobal() {
        $('#gEnabled').checked = state.global.enabled !== false;
        $('#gDebug').checked = state.global.debug === true;
        $('#gPrefix').value = state.global.command_prefix || '/';

        var tags = $('#adminTags');
        tags.innerHTML = '';
        state.global.global_admins.forEach(function (qq, i) {
            var tag = el('span', 'tag');
            tag.appendChild(el('b', null, qq));
            var x = el('i', null, '×');
            x.addEventListener('click', function () {
                state.global.global_admins.splice(i, 1);
                markDirty();
                renderGlobal();
            });
            tag.appendChild(x);
            tags.appendChild(tag);
        });
        if (!state.global.global_admins.length) tags.appendChild(el('span', 'tag grey', '暂无管理员'));
    }

    function renderProfiles() {
        var box = $('#profiles');
        box.innerHTML = '';

        if (!state.profiles.length) {
            box.appendChild(el('div', 'sub', '还没有群配置，点右上角「新增群配置」开始。'));
            return;
        }

        state.profiles.forEach(function (profile, index) {
            var card = el('div', 'profile');

            var head = el('div', 'profile-head');
            var name = textInput(profile.label, '配置名称', function (v) { profile.label = v; }, '280px');
            name.className = 'name';
            head.appendChild(name);
            head.appendChild(el('span', 'badge', '#' + (index + 1)));
            head.appendChild(el('span', 'spacer'));
            var del = el('button', 'danger', '删除此配置');
            del.addEventListener('click', function () {
                confirmBox('删除群配置', '确定删除「' + profile.label + '」？该操作会在保存后生效。').then(function (ok) {
                    if (!ok) return;
                    state.profiles.splice(index, 1);
                    markDirty();
                    renderProfiles();
                });
            });
            head.appendChild(del);
            card.appendChild(head);

            card.appendChild(groupPicker(profile));

            var table = el('table', 'features');
            var thead = el('thead');
            var tr = el('tr');
            ['功能', '启用', '群主/管理员可用', '允许使用的成员名单', '参数'].forEach(function (h) {
                tr.appendChild(el('th', null, h));
            });
            thead.appendChild(tr);
            table.appendChild(thead);

            var tbody = el('tbody');
            state.meta.features.forEach(function (meta) {
                var settings = profile.features[meta.key] || { enabled: false, allow_group_admin: false, allowed_users: [], params: {} };
                profile.features[meta.key] = settings;

                var row = el('tr');
                if (!settings.enabled) row.className = 'off';

                var nameCell = el('td', 'feat-name');
                nameCell.appendChild(el('div', null, meta.label));
                if (!meta.implemented) nameCell.appendChild(el('span', 'badge dev', '开发中'));
                nameCell.appendChild(el('div', 'sub', meta.usage.split('\n')[0]));
                row.appendChild(nameCell);

                var tdEnabled = el('td');
                tdEnabled.appendChild(switchBox(settings.enabled, '', function (v) {
                    settings.enabled = v;
                    row.className = v ? '' : 'off';
                }));
                row.appendChild(tdEnabled);

                var tdAdmin = el('td');
                tdAdmin.appendChild(switchBox(settings.allow_group_admin, '', function (v) {
                    settings.allow_group_admin = v;
                }));
                row.appendChild(tdAdmin);

                var tdList = el('td');
                tdList.appendChild(listEditor(settings.allowed_users, function () {}));
                row.appendChild(tdList);

                var tdParam = el('td');
                var paramsBox = renderParams(meta, settings);
                if (paramsBox) {
                    var toggle = el('button', null, '展开');
                    toggle.addEventListener('click', function () {
                        var open = paramsBox.style.display !== 'none';
                        paramsBox.style.display = open ? 'none' : 'block';
                        toggle.textContent = open ? '展开' : '收起';
                    });
                    paramsBox.style.display = 'none';
                    tdParam.appendChild(toggle);
                    tbody.appendChild(row);

                    var pRow = el('tr');
                    if (!settings.enabled) pRow.className = 'off';
                    var pTd = el('td');
                    pTd.colSpan = 5;
                    pTd.appendChild(paramsBox);
                    pRow.appendChild(pTd);
                    tbody.appendChild(pRow);
                } else {
                    tdParam.appendChild(el('span', 'sub', '无'));
                    tbody.appendChild(row);
                }
            });

            table.appendChild(tbody);
            card.appendChild(table);
            box.appendChild(card);
        });
    }

    function renderStatus() {
        request('/status').then(function (s) {
            state.status = s;
            $('#statusLine').textContent = s.pluginName + ' v' + s.version + ' · 运行 ' + s.uptime + ' · 数据目录 ' + s.dataPath;
            var grid = $('#statGrid');
            grid.innerHTML = '';
            [
                ['群配置条目', s.summary.profiles],
                ['已绑定群', s.summary.groups],
                ['收到消息', s.stats.messageReceived],
                ['执行命令', s.stats.commandHandled],
                ['处理事件', s.stats.eventHandled],
                ['异常次数', s.stats.errors]
            ].forEach(function (pair) {
                var box = el('div', 'stat');
                box.appendChild(el('b', null, String(pair[1])));
                box.appendChild(el('span', null, pair[0]));
                grid.appendChild(box);
            });
        }).catch(function (e) { toast('获取状态失败：' + e.message, 'err'); });
    }

    /* ---------------- 加载 / 保存 ---------------- */

    function loadAll() {
        return Promise.all([
            request('/meta'),
            request('/config'),
            request('/profiles'),
            request('/groups').catch(function () { return []; })
        ]).then(function (res) {
            state.meta = res[0];
            state.global = res[1];
            state.profiles = res[2];
            state.groups = res[3];
            renderGlobal();
            renderProfiles();
            renderStatus();
            clearDirty();
        }).catch(function (e) {
            toast('加载失败：' + e.message, 'err');
        });
    }

    function saveAll() {
        var payload = {
            enabled: $('#gEnabled').checked,
            debug: $('#gDebug').checked,
            command_prefix: $('#gPrefix').value.trim() || '/',
            global_admins: state.global.global_admins
        };
        request('/config', { method: 'POST', body: payload })
            .then(function () { return request('/profiles', { method: 'POST', body: { profiles: state.profiles } }); })
            .then(function (profiles) {
                state.profiles = profiles;
                state.global = payload;
                renderProfiles();
                clearDirty();
                renderStatus();
                toast('保存成功', 'ok');
            })
            .catch(function (e) { toast('保存失败：' + e.message, 'err'); });
    }

    /* ---------------- 事件绑定 ---------------- */

    $('#btnReload').addEventListener('click', function () {
        if (!state.dirty) { loadAll(); return; }
        confirmBox('重新加载', '有未保存的修改，确定放弃并重新加载？').then(function (ok) { if (ok) loadAll(); });
    });

    $('#btnSave').addEventListener('click', saveAll);
    $('#btnSave2').addEventListener('click', saveAll);

    $('#gEnabled').addEventListener('change', markDirty);
    $('#gDebug').addEventListener('change', markDirty);
    $('#gPrefix').addEventListener('input', markDirty);

    $('#btnAddAdmin').addEventListener('click', function () {
        var v = $('#adminInput').value.trim();
        if (!/^\d{5,12}$/.test(v)) { toast('请输入正确的 QQ 号', 'err'); return; }
        if (state.global.global_admins.indexOf(v) >= 0) { toast('该管理员已存在'); return; }
        state.global.global_admins.push(v);
        $('#adminInput').value = '';
        markDirty();
        renderGlobal();
    });

    $('#adminInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); $('#btnAddAdmin').click(); }
    });

    $('#btnAddProfile').addEventListener('click', function () {
        var profile = {
            id: 'profile-' + Date.now(),
            label: '新建群配置',
            group_ids: [],
            features: {}
        };
        state.meta.features.forEach(function (f) {
            var params = {};
            f.params.forEach(function (p) { params[p.key] = p.default; });
            profile.features[f.key] = {
                enabled: false,
                allow_group_admin: false,
                allowed_users: [],
                params: params
            };
        });
        state.profiles.push(profile);
        markDirty();
        renderProfiles();
        toast('已新增一条群配置，记得绑定群并保存');
    });

    $('#btnImport').addEventListener('click', function () {
        var dir = $('#importDir').value.trim();
        if (!dir) { toast('请填写旧插件 config 目录', 'err'); return; }
        var btn = $('#btnImport');
        btn.disabled = true;
        btn.textContent = '导入中…';
        request('/import', { method: 'POST', body: { dir: dir, overwriteData: $('#importOverwrite').checked } })
            .then(function (r) {
                $('#importResult').textContent = r.message + (r.files.length ? '，已复制数据文件：' + r.files.join('、') : '') + (r.errors.length ? '；警告：' + r.errors.join('；') : '');
                toast(r.message, 'ok');
                loadAll();
            })
            .catch(function (e) { toast('导入失败：' + e.message, 'err'); })
            .then(function () {
                btn.disabled = false;
                btn.textContent = '开始导入';
            });
    });

    window.addEventListener('beforeunload', function (e) {
        if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    loadAll();
})();
</script>
</body>
</html>
